<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Quota Meter</title><style>body{font:16px system-ui;max-width:620px;margin:auto;padding:20px;background:#10141d;color:#eee}section{background:#1c2431;padding:16px;margin:12px 0;border-radius:12px}input,button{font:inherit;padding:10px;margin:4px;max-width:90%}pre{white-space:pre-wrap}.warn{color:#ffca58}</style></head><body><h1>Quota Meter</h1><p class="warn">OpenAI and Claude integrations use unsupported private APIs.</p><section><h2>Wi-Fi</h2><button onclick="scan()">Scan</button><select id="ssid"></select><input id="manual" placeholder="SSID"><input id="wifiPass" type="password" placeholder="Password"><button onclick="saveWifi()">Save & connect</button></section><section><h2>Providers</h2><button onclick="action('/api/auth/openai/start')">Login OpenAI</button><button onclick="action('/api/auth/claude/start')">Login Claude</button><form onsubmit="claudeCode(event)"><input id="code" maxlength="2048" placeholder="Claude callback URL or code#state"><button>Submit Claude callback</button></form><button onclick="action('/api/providers/openai/refresh')">Refresh OpenAI</button><button onclick="action('/api/providers/claude/refresh')">Refresh Claude</button><button onclick="removeProvider('openai')">Logout OpenAI</button><button onclick="removeProvider('claude')">Logout Claude</button></section><section><h2>Status</h2><pre id="status">Loading…</pre></section><script src="/portal.js"></script></body></html>
