[platformio]
default_envs = jc3248w535en

[env:jc3248w535en]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = jc3248w535en
framework = espidf
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
extra_scripts = pre:tools/embed_portal.py
build_flags =
    -Isrc
    -Isrc/app
    -Isrc/auth
    -Isrc/console
    -Isrc/domain
    -Isrc/net
    -Isrc/portal
    -Isrc/providers
    -Isrc/ui
    -Isrc/util
    -DBOARD_HAS_PSRAM
    -DBSP_BOARD_HEADER=\"bsp/jc3248w535en.h\"
    -DBSP_LCD_COLOR_FORMAT=ESP_LCD_COLOR_FORMAT_RGB565
    -DBSP_LCD_BITS_PER_PIXEL=16
    -DBSP_LCD_COLOR_SPACE=ESP_LCD_COLOR_SPACE_RGB
    -DBSP_LCD_BIGENDIAN=1
    -DBSP_LCD_H_RES=480
    -DBSP_LCD_V_RES=320
    -DBSP_LCD_NATIVE_H_RES=320
    -DBSP_LCD_NATIVE_V_RES=480

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps = https://github.com/DaveGamble/cJSON.git#v1.7.18
build_flags =
    -std=c++17
    -Isrc
    -Isrc/auth
    -Isrc/domain
    -Isrc/net
    -Isrc/portal
    -Isrc/providers
    -Isrc/util
    -Isrc/ui
build_src_filter =
    +<domain/state_reducer.cpp>
    +<net/http_client.cpp>
    +<portal/portal_logic.cpp>
    +<providers/openai_protocol.cpp>
    +<providers/claude_protocol.cpp>
    +<util/base64url.cpp>
    +<ui/view_model.cpp>
